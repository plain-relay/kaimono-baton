name: Verify native apps

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-native-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ios-simulator:
    # Standard runners are free for public repositories. Never allocate one for a private repo.
    if: github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Verify Node runtime
        run: node -e "if (process.version !== 'v22.23.4') process.exit(1)"
      - name: Install dependencies
        run: npm ci
      - name: Check result parser
        run: python3 scripts/native_ci_test.py
      - name: Sync bundled assets and pinned SwiftPM plugins
        run: npm run sync:native
      - name: Unsigned Simulator build and synthetic UI tests
        run: python3 scripts/ios-simulator-ci.py
      - name: Upload Simulator app and bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-${{ github.event.pull_request.head.sha }}
          path: |
            artifacts/ios/summary.json
            artifacts/ios/App-simulator.tar.gz
          if-no-files-found: error
          retention-days: 3

  android-emulator:
    if: github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install and sync
        run: |
          node -e "if (process.version !== 'v22.23.4') process.exit(1)"
          npm ci
          npm run sync:native
      - name: Build application and existing instrumentation tests
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
          android/gradlew -p android :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - name: Enable KVM on the disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Rerun four existing synthetic native cases
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: Nexus 4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          script: python3 scripts/android-emulator-ci.py
      - name: Upload debug APK and bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-${{ github.event.pull_request.head.sha }}
          path: |
            artifacts/android-ci/summary.json
            artifacts/android-ci/app-debug.apk
          if-no-files-found: error
          retention-days: 3
