name: Verify pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Worker tests
        run: npm run test:worker

      - name: Worker bundle check
        run: npm run check:worker-bundle

      - name: Coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
